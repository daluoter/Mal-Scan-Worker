services:
  # PostgreSQL - Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'MC_HOST_local="http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc ready local']
      interval: 30s
      timeout: 20s
      retries: 3

  # RabbitMQ - Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ClamAV - AntiVirus Daemon (Offline Support)
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      # Disable freshclam for offline environment compatibility
      - CLAMAV_NO_FRESHCLAMD=${CLAMAV_NO_FRESHCLAMD:-false}
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Worker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_SANDBOX_QUEUE: malscan.jobs.sandbox
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-capev2}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-}
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-900}
      SANDBOX_POLL_INTERVAL_SECONDS: ${SANDBOX_POLL_INTERVAL_SECONDS:-10}
      SANDBOX_ENABLE_URL_SUBMISSION: ${SANDBOX_ENABLE_URL_SUBMISSION:-false}
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_started

  sandbox-worker:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "-m", "malscan_worker.sandbox_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_SANDBOX_QUEUE: malscan.jobs.sandbox
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-capev2}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-}
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-900}
      SANDBOX_POLL_INTERVAL_SECONDS: ${SANDBOX_POLL_INTERVAL_SECONDS:-10}
      SANDBOX_ENABLE_URL_SUBMISSION: ${SANDBOX_ENABLE_URL_SUBMISSION:-false}
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - clamav

  # Explicit read-only check; this does not create CAPE hosts or analysis VMs.
  sandbox-preflight:
    profiles: [sandbox-check]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "-m", "malscan_worker.sandbox.preflight"]
    environment:
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-capev2}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-}
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
      SANDBOX_PREFLIGHT_TIMEOUT_SECONDS: ${SANDBOX_PREFLIGHT_TIMEOUT_SECONDS:-10}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Go Ingest Service — replaces POST /api/v1/files
  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: 8080
      LOG_LEVEL: INFO
      UPLOAD_RATE_LIMIT_ENABLED: ${UPLOAD_RATE_LIMIT_ENABLED:-true}
      UPLOAD_RATE_LIMIT_RPM: ${UPLOAD_RATE_LIMIT_RPM:-6}
      UPLOAD_RATE_LIMIT_BURST: ${UPLOAD_RATE_LIMIT_BURST:-2}
      UPLOAD_AUTH_ENABLED: ${UPLOAD_AUTH_ENABLED:-false}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Nginx Reverse Proxy — routes POST /api/v1/files to Go, everything else to FastAPI
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ingest

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  clamav_data:
